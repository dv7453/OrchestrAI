services:
  - type: web
    name: orchestrai
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: BROWSER_USE_HEADLESS
        value: "true"
      - key: ANONYMIZED_TELEMETRY
        value: "false"
      - key: PYTHONUNBUFFERED
        value: "1"
